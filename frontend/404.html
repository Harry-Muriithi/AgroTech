<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3d2b">
  <title>AgroTech — Page Not Found</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f1;color:#1a1a1a;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border:1px solid #d5e8da;border-radius:16px;max-width:440px;width:100%;
      padding:40px 32px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
    .leaf{font-size:54px;margin-bottom:10px}
    .code{font-size:64px;font-weight:800;color:#1a3d2b;line-height:1}
    .code span{color:#52b788}
    h1{font-size:20px;font-weight:700;color:#1a3d2b;margin:14px 0 8px}
    p{font-size:14px;color:#666;line-height:1.55;margin-bottom:24px}
    .btn{display:inline-block;background:#1a3d2b;color:#fff;text-decoration:none;
      padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;transition:background .15s}
    .btn:hover{background:#2d6a4f}
    .alt{display:block;margin-top:16px;font-size:13px;color:#52b788;text-decoration:none}
    .alt:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="leaf">🌿</div>
    <div class="code">4<span>0</span>4</div>
    <h1>This page wandered off the farm</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to familiar ground.</p>
    <a class="btn" href="/pages/dashboard.html">Go to Dashboard</a>
    <a class="alt" href="/index.html">Back to login</a>
  </div>
</body>
</html>
